# --- nvim-ai: 让启用了鼠标的应用(Neovim/less 等)自己处理滚轮 ---
# 应用请求鼠标时把滚轮事件转发给它;否则进入 tmux copy-mode。
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'"
